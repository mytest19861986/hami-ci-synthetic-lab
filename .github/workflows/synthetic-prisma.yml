name: synthetic-prisma-contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNTHETIC_LAB: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enforce fresh synthetic database
        run: |
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          test "$(realpath -e "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          test "$SYNTHETIC_LAB" = '1'
          dir="$(mktemp -d "$RUNNER_TEMP/prisma-lab.XXXXXXXX")"
          test "$(realpath -e "$dir")" = "$dir"
          test ! -e "$dir/synthetic.db"
          test ! -L "$dir/synthetic.db"
          echo "DATABASE_URL=file:$dir/synthetic.db" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prisma generate
      - run: npm run typecheck
      - run: npx --no-install prisma db push --skip-generate
      - run: npm test
